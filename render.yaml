services:
  - type: web
    name: feishu-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FEISHU_APP_ID
        sync: false
      - key: FEISHU_APP_SECRET
        sync: false
      - key: SILICONFLOW_API_KEY
        sync: false
      - key: ENABLE_FEISHU_CHAT_WS
        value: "false"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        sync: false

  - type: cron
    name: feishu-daily-report
    runtime: python
    plan: starter
    schedule: "30 14 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python cloud_daily_report.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FEISHU_APP_ID
        sync: false
      - key: FEISHU_APP_SECRET
        sync: false
      - key: SILICONFLOW_API_KEY
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_NAME
        sync: false
      - key: DAILY_REPORT_CHAT_ID
        sync: false
      - key: OBSIDIAN_GITHUB_TOKEN
        sync: false
      - key: OBSIDIAN_GITHUB_REPO
        sync: false
      - key: OBSIDIAN_GITHUB_BRANCH
        value: main
      - key: OBSIDIAN_REPORT_DIR
        value: 工作日报
      - key: DAILY_REPORT_STABILITY_DEADLINE_MINUTES
        value: "15"
      - key: DAILY_REPORT_STABILITY_INTERVAL_SECONDS
        value: "60"
